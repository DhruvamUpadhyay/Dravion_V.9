[tool.poetry]
name = "dravion"
version = "0.9.0"
description = "DRAVION v.9 — Autonomous Agentic Intelligence System"
authors = ["Dhruvam"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# Core
pydantic = "^2.0"
pydantic-settings = "^2.0"
structlog = "^24.0"
python-dotenv = "^1.0"

# LLM (Ollama uses OpenAI-compatible API — zero data sent to OpenAI)
openai = "^1.0"

# Memory
chromadb = "^0.5"
sentence-transformers = "^3.0"

# API (for future web UI and remote access)
fastapi = "^0.111"
uvicorn = "^0.29"
aiohttp = "^3.9"

# Voice
SpeechRecognition = "^3.10"
PyAudio = "^0.2"
pygame = "^2.6"
PyJWT = "^2.8"
cryptography = "^44.0"

# System
psutil = "^5.9"
pyautogui = "^0.9"
pyperclip = "^1.8"
google-auth = "^2.50.0"
google-auth-oauthlib = "^1.3.1"
google-auth-httplib2 = "^0.3.1"
google-api-python-client = "^2.195.0"
opencv-python = "^4.13.0.92"
pytesseract = "^0.3.13"
pillow = "^12.2.0"
playwright = "^1.59.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
